{% set version = "1.0.0" %}

package:
  name: locket
  version: {{ version }}

source:
  fn: locket-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/l/locket/locket-{{ version }}.tar.gz
  md5: fff6d2fcd92fbeb9af9dbc260eb0b5e8

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - locket

about:
  home: https://github.com/mwilliamson/locket.py
  license: BSD-2-Clause
  license_file: LICENSE
  summary: File-based locks for Python for Linux and Windows

extra:
  recipe-maintainers:
    - madkinsz
    - jcrist
